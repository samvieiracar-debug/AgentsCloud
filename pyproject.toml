[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "agentscloud"
version = "0.1.0"
description = "Compartilhe agentes TOML do Codex por Git."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["questionary>=2.1,<3", "textual>=8.2.8,<9"]

[project.scripts]
agentscloud = "agentscloud.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agentscloud"]

[tool.uv]
link-mode = "copy"
